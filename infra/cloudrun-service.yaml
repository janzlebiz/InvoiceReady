apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: invoiceready-prod
  namespace: gen-lang-client-0427039673
  labels:
    cloud.googleapis.com/location: asia-east1
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/client-name: gcloud
        run.googleapis.com/cloudsql-instances: gen-lang-client-0427039673:asia-east1:invoiceready-postgres
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: invoiceready-runner@gen-lang-client-0427039673.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      # Main Application Container
      - name: app
        image: asia-east1-docker.pkg.dev/gen-lang-client-0427039673/invoiceready-repo/invoiceready-app@sha256:4a8b79e1025d57c2317e1329c0bca8085a864192787766b44ecb72e5058728b9
        ports:
        - name: http1
          containerPort: 3000
        resources:
          limits:
            cpu: "2000m"
            memory: "2Gi"
        env:
        - name: NODE_ENV
          value: "production"
        - name: GOOGLE_CLOUD_PROJECT
          value: "gen-lang-client-0427039673"
        - name: GCP_PROJECT_ID
          value: "gen-lang-client-0427039673"
        - name: GCP_REGION
          value: "asia-east1"
        - name: GCS_QUARANTINE_BUCKET
          value: "gen-lang-client-0427039673-quarantine"
        - name: GCS_PRIVATE_BUCKET
          value: "gen-lang-client-0427039673-documents"
        - name: GCS_DOCUMENTS_BUCKET
          value: "gen-lang-client-0427039673-documents"
        - name: CLOUDSQL_INSTANCE_CONNECTION_NAME
          value: "gen-lang-client-0427039673:asia-east1:invoiceready-postgres"
        - name: CLOUD_TASKS_QUEUE
          value: "invoiceready-task-queue"
        - name: SCHEDULER_SERVICE_ACCOUNT
          value: "invoiceready-runner@gen-lang-client-0427039673.iam.gserviceaccount.com"
        - name: SCHEDULER_AUDIENCE
          value: "https://invoiceready-prod-epvy5srfb5ewhdo7mgmmu7-212282537635.asia-east1.run.app"
        - name: CLOUD_TASKS_SERVICE_ACCOUNT
          value: "invoiceready-runner@gen-lang-client-0427039673.iam.gserviceaccount.com"
        - name: CLOUD_TASKS_AUDIENCE
          value: "https://invoiceready-prod-epvy5srfb5ewhdo7mgmmu7-212282537635.asia-east1.run.app"
        - name: CLAMAV_HOST
          value: "127.0.0.1"
        - name: CLAMAV_PORT
          value: "3310"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: DATABASE_URL
              key: latest
        - name: INTERNAL_TASK_SECRET
          valueFrom:
            secretKeyRef:
              name: INTERNAL_TASK_SECRET
              key: latest
        - name: CRON_SECRET
          valueFrom:
            secretKeyRef:
              name: CRON_SECRET
              key: latest
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: GEMINI_API_KEY
              key: latest
        startupProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          periodSeconds: 15
      # ClamAV Antivirus Daemon Sidecar Container
      - name: clamav-sidecar
        image: asia-east1-docker.pkg.dev/gen-lang-client-0427039673/invoiceready-repo/clamav-sidecar@sha256:69b4c06b29738096d27ec29a0224d08b3e8b0b8dbb8e21a22129e924765668dc
        ports:
        - name: clamav
          containerPort: 3310
        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
